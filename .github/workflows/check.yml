name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/audio/*.test.cjs
      - name: Check real compiler cache hits and CPU/header invalidation
        run: python scripts/check_compiler_cache.py --compiler /usr/bin/clang
      - name: Validate launcher syntax
        run: bash -n integration/launcher/discord-launcher.sh
      - name: Compile the independent camera support binary
        run: python scripts/build_camera_support.py --output out/camera-support
      - name: Retain the camera binary and build identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camera-support
          path: out/camera-support/
          retention-days: 7
  native-baselines:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-runtime.yml
  source-assembly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reconstruct the imported fork and all candidate ports
        shell: bash
        run: |
          for target in patch-base stable prerelease nightly; do
            python3 scripts/assemble.py "$target" \
              --destination ".work/$target" --report "out/source-$target.json"
          done
      - name: Retain source diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-diagnostics
          path: out/source-*.json
          retention-days: 7
  arch-packaging:
    uses: ./.github/workflows/package-check.yml
  application-audio:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-audio.yml
