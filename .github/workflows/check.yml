name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
      - run: uv sync --locked
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run test
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Lint GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: Check real compiler cache hits and CPU/header invalidation
        run: python scripts/check_compiler_cache.py --compiler /usr/bin/clang
      - name: Validate launcher syntax
        run: bash -n integration/launcher/discord-launcher.sh
      - name: Compile the independent camera support binary
        run: python scripts/build_camera_support.py --output out/camera-support
      - name: Retain the camera binary and build identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camera-support
          path: out/camera-support/
          retention-days: 7
  native-baselines:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-runtime.yml
  source-assembly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reconstruct the imported fork and prerelease port
        shell: bash
        run: |
          for target in patch-base prerelease; do
            python3 scripts/assemble.py "$target" \
              --destination ".work/$target" --report "out/source-$target.json"
          done
      - name: Retain source diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-diagnostics
          path: out/source-*.json
          retention-days: 7
  arch-packaging:
    uses: ./.github/workflows/package-check.yml
  application-audio:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-audio.yml
