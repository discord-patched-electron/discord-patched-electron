name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - name: Validate launcher syntax
        run: bash -n integration/launcher/discord-launcher.sh
  native-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libnode-dev xvfb xauth brotli \
            libnss3 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxtst6
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts
      - name: Permit sandbox namespaces for the disposable test runtimes
        shell: bash
        run: |
          # Ubuntu restricts user namespaces for downloaded Chromium executables.
          # Scope its documented exception to this job's copied fixture binaries.
          cat <<EOF | sudo tee /etc/apparmor.d/discord-native-fixture >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile discord-native-fixture "$GITHUB_WORKSPACE/out/native-baselines/*/probe/runtime/Discord*" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/discord-native-fixture
      - name: Check native video and offline Krisp for every client channel
        run: python scripts/check_runtime_clients.py --output out/native-baselines
      - name: Retain native fixture diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-baseline-diagnostics
          path: |
            out/native-baselines/runtime-checks.json
            out/native-baselines/*/audio-report.json
            out/native-baselines/*/krisp-patch.json
            out/native-baselines/*/probe/runtime-report.json
            out/native-baselines/*/probe/runtime.log
            out/native-baselines/*/probe/profile/voice/discord-webrtc_*
          retention-days: 7
          if-no-files-found: warn
  source-assembly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reconstruct the imported fork and all candidate ports
        shell: bash
        run: |
          for target in patch-base stable prerelease nightly; do
            python3 scripts/assemble.py "$target" \
              --destination ".work/$target" --report "out/source-$target.json"
          done
      - name: Retain source diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-diagnostics
          path: out/source-*.json
          retention-days: 7
  arch-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the Arch packaging environment
        run: docker build -t discord-electron-arch-packaging ci/arch
      - name: Package all nine combinations with a dummy runtime
        shell: bash
        run: |
          mkdir -p out/packaging
          sudo chown 1000:1000 out/packaging
          docker run --rm --cpus 2 --memory 4g \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/out/packaging:/packages" \
            discord-electron-arch-packaging \
            python /repo/scripts/smoke_packages.py --output /packages
      - name: Return diagnostic files to the Actions user
        if: always()
        run: |
          if [ -d out/packaging ]; then
            sudo chown -R "$(id -u):$(id -g)" out/packaging
          fi
      - name: Retain packaging diagnostics only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arch-packaging-diagnostics
          path: |
            out/packaging/packaging-report.json
            out/packaging/arch-packages.txt
            out/packaging/*/packaging-report.json
            out/packaging/*/makepkg.log
          retention-days: 7
          if-no-files-found: warn
