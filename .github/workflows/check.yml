name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      unit: ${{ steps.scope.outputs.unit }}
      source: ${{ steps.scope.outputs.source }}
      native: ${{ steps.scope.outputs.native }}
      audio: ${{ steps.scope.outputs.audio }}
      packaging: ${{ steps.scope.outputs.packaging }}
      compiler: ${{ steps.scope.outputs.compiler }}
      camera: ${{ steps.scope.outputs.camera }}
      capture: ${{ steps.scope.outputs.capture }}
      appimage: ${{ steps.scope.outputs.appimage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete change
        id: scope
        run: python3 scripts/ci_scope.py
  tests:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - if: needs.changes.outputs.unit == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli gpg gpgv libclang-dev libpipewire-0.3-dev libgbm-dev libegl-dev libgles-dev libdrm-dev libva-dev nasm libcap-dev libwayland-dev libwayland-bin libvulkan-dev libgl-dev libx11-dev libxcb1-dev libxcb-xfixes0-dev cmake ninja-build
      - run: bun run lint:source
      - run: bun run lint:rust
        if: needs.changes.outputs.unit == 'true'
      - run: bun run test
        if: needs.changes.outputs.unit == 'true'
      - name: Check real compiler cache hits and CPU/header invalidation
        if: needs.changes.outputs.compiler == 'true'
        run: python scripts/check_compiler_cache.py --compiler /usr/bin/clang
      - name: Restore independent HEVC compiler objects
        if: needs.changes.outputs.camera == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: out/hevc-build
          key: hevc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_hevc_support.py', 'native/**', 'Cargo.lock', 'rust-toolchain.toml', 'integration/video/encoder-abi.h') }}
          restore-keys: hevc-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile the independent camera support binary
        if: needs.changes.outputs.camera == 'true'
        run: python scripts/build_camera_support.py --output out/camera-support
      - name: Retain the camera binary and build identity
        if: needs.changes.outputs.camera == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camera-support
          path: out/camera-support/
          retention-days: 7
      - name: Build capture helpers independently of Electron
        if: needs.changes.outputs.capture == 'true'
        run: python scripts/stage_capture_backends.py --output out/capture-support
      - name: Retain capture helpers and corresponding source
        if: needs.changes.outputs.capture == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: capture-support
          path: out/capture-support/
          retention-days: 7
          if-no-files-found: error
  native-baselines:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-runtime.yml
  source-assembly:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reconstruct the imported fork and enabled Electron ports
        shell: bash
        run: |
          selected=$(python3 scripts/channels.py --electron)
          mapfile -t targets <<< "$selected"
          for target in patch-base "${targets[@]}"; do
            python3 scripts/assemble.py "$target" \
              --destination ".work/$target" --report "out/source-$target.json"
          done
      - name: Retain source diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-diagnostics
          path: out/source-*.json
          retention-days: 7
  arch-packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/package-check.yml
  application-audio:
    needs: changes
    if: needs.changes.outputs.audio == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-audio.yml
  appimage:
    needs: changes
    if: needs.changes.outputs.appimage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-pinned builder and runtime
        run: python3 scripts/appimage.py --install out/appimage-tools --dependencies
      - name: Build and launch an AppImage from this checkout without FUSE
        run: python3 scripts/check_appimage.py --container
  complete:
    name: Checks complete
    if: always()
    needs:
      [
        changes,
        tests,
        native-baselines,
        source-assembly,
        arch-packaging,
        application-audio,
        appimage,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["RESULTS"])
          expected = {"changes": "success", "tests": "success"}
          scopes = jobs["changes"]["outputs"]
          for job, scope in {
              "native-baselines": "native", "source-assembly": "source",
              "arch-packaging": "packaging", "application-audio": "audio",
              "appimage": "appimage",
          }.items():
              expected[job] = "success" if scopes.get(scope) == "true" else "skipped"
          failed = [job for job, result in expected.items() if jobs[job]["result"] != result]
          if failed:
              raise SystemExit("Checks did not complete as selected: " + ", ".join(failed))
          PY
