name: Native runtime validation
on:
  workflow_call:
    inputs:
      reference_run:
        description: Successful reference or candidate compiler run ID; empty checks bundled runtimes
        type: string
        required: false
        default: ''
      clients_state:
        description: Immutable ci-state commit for discovered clients; empty uses bootstrap locks
        type: string
        required: false
        default: ''
      discord_channels:
        description: Comma-separated Discord channels, or all
        type: string
        required: false
        default: all
  workflow_dispatch:
    inputs:
      reference_run:
        description: Successful reference or candidate compiler run ID; empty checks bundled runtimes
        type: string
        required: false
        default: ''
      clients_state:
        description: Immutable ci-state commit for discovered clients; empty uses bootstrap locks
        type: string
        required: false
        default: ''
      discord_channels:
        description: Comma-separated Discord channels, or all
        type: string
        required: false
        default: all
  workflow_run:
    workflows: [Reference build capacity, Blacksmith reference capacity, Candidate Electron build]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      REFERENCE_RUN: ${{ github.event.workflow_run.id || inputs.reference_run || '' }}
      CLIENTS_STATE: ${{ inputs.clients_state || '' }}
      DISCORD_CHANNELS: ${{ inputs.discord_channels || 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libnode-dev xvfb xauth brotli \
            libnss3 libgtk-3-0t64 libgbm1 libasound2t64 libpulse0 libatomic1 libxss1 libxtst6
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts
      - name: Permit sandbox namespaces for the disposable test runtimes
        shell: bash
        run: |
          # Ubuntu restricts user namespaces for downloaded Chromium executables.
          # Scope its documented exception to this job's copied fixture binaries.
          cat <<EOF | sudo tee /etc/apparmor.d/discord-native-fixture >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile discord-native-fixture "$GITHUB_WORKSPACE/out/native-runtime/*/probe/runtime/{Discord*,electron}" flags=(unconfined) {
            userns,
          }
          profile discord-capture-fixture "$GITHUB_WORKSPACE/out/frame-capture/runtime/electron" flags=(unconfined) {
            userns,
          }
          profile discord-storage-fixture "$GITHUB_WORKSPACE/out/safe-storage/runtime/electron" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/discord-native-fixture
      - name: Download and verify a completed custom build
        if: env.REFERENCE_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/fetch_reference.py "$REFERENCE_RUN" --output out/reference-download
      - name: Fetch the exact discovered client snapshot
        if: env.CLIENTS_STATE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/fetch_client_snapshot.py "$CLIENTS_STATE" --output out/clients.lock.json
      - name: Check native video and offline Krisp for selected client channels
        shell: bash
        run: |
          args=()
          if [ -n "$REFERENCE_RUN" ]; then
            args+=(--runtime out/reference-download/runtime --provenance out/reference-download/artifact-provenance.json)
          fi
          if [ -n "$CLIENTS_STATE" ]; then
            args+=(--clients out/clients.lock.json)
          fi
          if [ "$DISCORD_CHANNELS" != all ]; then
            IFS=',' read -r -a channels <<< "$DISCORD_CHANNELS"
            for channel in "${channels[@]}"; do
              args+=(--discord "$channel")
            done
          fi
          python scripts/check_runtime_clients.py --output out/native-runtime "${args[@]}"
      - name: Check frame capture lifetime through garbage collection and teardown
        if: env.REFERENCE_RUN != ''
        run: >-
          xvfb-run -a python scripts/check_frame_capture.py
          out/reference-download/runtime/electron
          --provenance out/reference-download/artifact-provenance.json
          --output out/frame-capture
      - name: Check safeStorage IPC and relaunch with synthetic credentials
        if: env.REFERENCE_RUN != ''
        run: >-
          xvfb-run -a python scripts/check_safe_storage.py
          --runtime out/reference-download/runtime/electron
          --output out/safe-storage
      - name: Retain native fixture diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-runtime-diagnostics-${{ github.run_id }}
          path: |
            out/reference-download/artifact-provenance.json
            out/clients.lock.json
            out/clients.lock.provenance.json
            out/native-runtime/runtime-checks.json
            out/native-runtime/*/client-check.json
            out/native-runtime/*/audio-report.json
            out/native-runtime/*/krisp-patch.json
            out/native-runtime/*/probe/runtime-report.json
            out/native-runtime/*/probe/runtime.log
            out/native-runtime/*/probe/profile/voice/discord-webrtc_*
            out/frame-capture/frame-capture.json
            out/frame-capture/console.log
            out/safe-storage/storage-report.json
            out/safe-storage/console-*.log
          retention-days: 7
          if-no-files-found: warn
