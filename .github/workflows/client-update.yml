name: Qualify Discord client update
on:
  workflow_call:
    inputs:
      clients_state:
        type: string
        required: true
      discord_channel:
        type: string
        required: true
      reference_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  bundled:
    uses: ./.github/workflows/native-runtime.yml
    with:
      clients_state: ${{ inputs.clients_state }}
      discord_channels: ${{ inputs.discord_channel }}
  native:
    uses: ./.github/workflows/native-runtime.yml
    with:
      clients_state: ${{ inputs.clients_state }}
      discord_channels: ${{ inputs.discord_channel }}
      reference_run: ${{ inputs.reference_run }}
  audio:
    uses: ./.github/workflows/app-audio.yml
    with:
      clients_state: ${{ inputs.clients_state }}
      discord_channels: ${{ inputs.discord_channel }}
      reference_run: ${{ inputs.reference_run }}
  packaging:
    uses: ./.github/workflows/package-check.yml
    with:
      clients_state: ${{ inputs.clients_state }}
      discord_channels: ${{ inputs.discord_channel }}
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLIENTS_STATE: ${{ inputs.clients_state }}
      DISCORD_CHANNEL: ${{ inputs.discord_channel }}
      REFERENCE_RUN: ${{ inputs.reference_run }}
      DPE_EQUICORD_HOME: ${{ github.workspace }}/out/equicord
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - name: Prepare launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential xvfb xauth brotli libnss3 libgtk-3-0t64 libgbm1 libasound2t64 libpulse0 libatomic1 libxss1 libxtst6
          uv sync --locked
          npm ci --ignore-scripts
          cat <<EOF | sudo tee /etc/apparmor.d/discord-launch-fixture >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile discord-launch-fixture "$GITHUB_WORKSPACE/out/local-client/runtime/electron" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/discord-launch-fixture
      - name: Assemble the exact client on the last tested runtime
        run: |
          python scripts/fetch_client_snapshot.py "$CLIENTS_STATE" --output out/clients.lock.json
          python scripts/fetch_reference.py "$REFERENCE_RUN" --output out/runtime
          python scripts/build_local_app.py --discord "$DISCORD_CHANNEL" --clients out/clients.lock.json --artifact out/runtime --cache out/downloads --output out/local-client
      - name: Check login form and relaunch without an account
        run: xvfb-run -a python scripts/check_desktop_launch.py out/local-client --output out/launch --relaunch
      - name: Check optional Equicord injection on a separate fresh profile
        run: |
          python integration/launcher/equicord.py install --home "$DPE_EQUICORD_HOME"
          xvfb-run -a python scripts/check_desktop_launch.py out/local-client --output out/mod-launch --relaunch --equicord
      - name: Retain launch metadata only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-launch-${{ inputs.discord_channel }}
          path: |
            out/local-client/local-build.json
            out/launch/launch-report.json
            out/launch/relaunch/launch-report.json
            out/mod-launch/launch-report.json
            out/mod-launch/relaunch/launch-report.json
            out/equicord/install.json
          retention-days: 14
