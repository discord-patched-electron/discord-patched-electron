name: Application audio validation
on:
  workflow_call:
    inputs:
      clients_state:
        type: string
        required: false
        default: ""
      discord_channels:
        type: string
        required: false
        default: all
      reference_run:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      clients_state:
        type: string
        required: false
        default: ""
      discord_channels:
        type: string
        required: false
        default: all
      reference_run:
        description: Successful compiler run ID; empty uses bundled baselines
        type: string
        required: false
        default: ""
  workflow_run:
    workflows: [Reference build capacity, Blacksmith reference capacity, Candidate Electron build]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      CLIENTS_STATE: ${{ inputs.clients_state || '' }}
      DISCORD_CHANNELS: ${{ inputs.discord_channels || 'all' }}
      REFERENCE_RUN: ${{ github.event.workflow_run.id || inputs.reference_run || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Fetch and verify the completed compiler artifact
        if: env.REFERENCE_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/fetch_reference.py "$REFERENCE_RUN" --output out/reference-download
          chmod a+r out/reference-download/artifact-provenance.json
      - name: Fetch the exact discovered client snapshot
        if: env.CLIENTS_STATE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/fetch_client_snapshot.py "$CLIENTS_STATE" --output out/clients.lock.json
          chmod 644 out/clients.lock.json
      - name: Prepare fixture tools and exact client archives
        run: |
          uv sync --locked
          npm ci --ignore-scripts
          channels=(stable ptb canary)
          if [ "$DISCORD_CHANNELS" != all ]; then
            IFS=',' read -r -a channels <<< "$DISCORD_CHANNELS"
          fi
          for channel in "${channels[@]}"; do
            case "$channel" in stable|ptb|canary) ;; *) exit 1 ;; esac
          done
          args=()
          if [ -n "$REFERENCE_RUN" ]; then
            args+=(--runtime out/reference-download/runtime --provenance out/reference-download/artifact-provenance.json)
          fi
          if [ -n "$CLIENTS_STATE" ]; then args+=(--clients out/clients.lock.json); fi
          for channel in "${channels[@]}"; do
            python scripts/check_app_audio.py --discord "$channel" --output "out/app-audio/$channel" --download-only "${args[@]}"
            for server in pipewire pulseaudio; do
              mkdir -p "out/wayland-audio/$channel/$server"
              cp out/app-audio/"$channel"/*.tar.br "out/wayland-audio/$channel/$server/"
            done
          done
          mkdir -p out/wayland-audio/${channels[0]}/manual
          cp out/app-audio/"${channels[0]}"/*.tar.br out/wayland-audio/${channels[0]}/manual/
      - name: Build disposable audio environment
        run: |
          docker build -t discord-electron-arch-packaging ci/arch
          docker build -t discord-electron-audio-fixture ci/audio
      - name: Restore the compiled test compositor
        id: compositor-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/wayland-test-tools/niri
            out/wayland-test-tools/niri-source
            out/wayland-test-tools/niri.sha256
          key: wayland-test-niri-${{ runner.arch }}-${{ hashFiles('scripts/build_test_compositor.sh', 'ci/audio/niri.Dockerfile') }}
      - name: Build or verify the pinned GPU-free test compositor
        run: |
          mkdir -p out/wayland-test-tools
          if [ -x out/wayland-test-tools/niri ] && docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/out/wayland-test-tools:/build:ro" \
            discord-electron-audio-fixture sh -c 'cd /build && sha256sum -c niri.sha256 && ./niri --version'; then
            exit 0
          fi
          docker build -t discord-electron-test-compositor -f ci/audio/niri.Dockerfile .
          sudo chown -R 1000:1000 out/wayland-test-tools
          docker run --rm --cpus 2 --memory 5g \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/out/wayland-test-tools:/build" \
            discord-electron-test-compositor bash /repo/scripts/build_test_compositor.sh
      - name: Save the completed compositor without caching Rust build objects
        if: steps.compositor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/wayland-test-tools/niri
            out/wayland-test-tools/niri-source
            out/wayland-test-tools/niri.sha256
          key: ${{ steps.compositor-cache.outputs.cache-primary-key }}
      - name: Test every channel with isolated audio and no network
        shell: bash
        run: |
          sudo chown -R 1000:1000 out/app-audio
          channels=(stable ptb canary)
          if [ "$DISCORD_CHANNELS" != all ]; then
            IFS=',' read -r -a channels <<< "$DISCORD_CHANNELS"
          fi
          for channel in "${channels[@]}"; do
            case "$channel" in stable|ptb|canary) ;; *) exit 1 ;; esac
          done
          args=()
          if [ -n "$REFERENCE_RUN" ]; then
            args+=(--runtime /repo/out/reference-download/runtime --provenance /repo/out/reference-download/artifact-provenance.json)
          fi
          if [ -n "$CLIENTS_STATE" ]; then args+=(--clients /repo/out/clients.lock.json); fi
          failed=0
          for channel in "${channels[@]}"; do
            if ! docker run --rm --network none --cpus 4 --memory 4g \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              -v "$GITHUB_WORKSPACE/out/app-audio/$channel:/audio" \
              discord-electron-audio-fixture \
              python /repo/scripts/check_app_audio.py --discord "$channel" --output /audio "${args[@]}"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Validate native Wayland video and application audio with both servers
        shell: bash
        run: |
          sudo chown -R 1000:1000 out/wayland-audio
          channels=(stable ptb canary)
          if [ "$DISCORD_CHANNELS" != all ]; then
            IFS=',' read -r -a channels <<< "$DISCORD_CHANNELS"
          fi
          for channel in "${channels[@]}"; do
            case "$channel" in stable|ptb|canary) ;; *) exit 1 ;; esac
          done
          args=()
          if [ -n "$REFERENCE_RUN" ]; then
            args+=(--runtime /repo/out/reference-download/runtime --provenance /repo/out/reference-download/artifact-provenance.json)
          fi
          if [ -n "$CLIENTS_STATE" ]; then args+=(--clients /repo/out/clients.lock.json); fi
          failed=0
          for channel in "${channels[@]}"; do
            for server in pipewire pulseaudio; do
              if ! docker run --rm --network none --cpus 4 --memory 4g \
                -v "$GITHUB_WORKSPACE:/repo:ro" \
                -v "$GITHUB_WORKSPACE/out/wayland-test-tools/niri:/usr/bin/niri:ro" \
                -v "$GITHUB_WORKSPACE/out/wayland-audio/$channel/$server:/audio" \
                discord-electron-audio-fixture python /repo/scripts/check_wayland_audio.py \
                --discord "$channel" --pulse "$server" --output /audio "${args[@]}"; then
                failed=1
              fi
            done
          done
          if ! docker run --rm --network none --cpus 4 --memory 4g \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/out/wayland-test-tools/niri:/usr/bin/niri:ro" \
            -v "$GITHUB_WORKSPACE/out/wayland-audio/${channels[0]}/manual:/audio" \
            discord-electron-audio-fixture python /repo/scripts/check_wayland_audio.py \
            --selection manual --discord "${channels[0]}" --output /audio "${args[@]}"; then
            failed=1
          fi
          exit "$failed"
      - name: Return diagnostics to the Actions user
        if: always()
        run: |
          if [ -d out/app-audio ]; then
            sudo chown -R "$(id -u):$(id -g)" out/app-audio
          fi
          if [ -d out/wayland-audio ]; then
            sudo chown -R "$(id -u):$(id -g)" out/wayland-audio
          fi
      - name: Retain synthetic audio diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: application-audio-diagnostics-${{ inputs.discord_channels || 'all' }}
          path: |
            out/reference-download/artifact-provenance.json
            out/app-audio/*/audio-report.json
            out/app-audio/*/identity.json
            out/app-audio/*/fixture.json
            out/app-audio/*/*.log
            out/app-audio/*/discord-webrtc_*
            out/wayland-test-tools/niri-source
            out/wayland-test-tools/niri.sha256
            out/wayland-audio/*/*/audio-report.json
            out/wayland-audio/*/*/identity.json
            out/wayland-audio/*/*/fixture.json
            out/wayland-audio/*/*/lifecycle.json
            out/wayland-audio/*/*/*.log
            out/wayland-audio/*/*/discord-webrtc_*
          retention-days: 7
          if-no-files-found: warn
