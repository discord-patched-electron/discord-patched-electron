name: Import local Electron runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'discord-patched-electron/discord-patched-electron' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the pinned local runtime and its compiler report
        run: python3 scripts/import_local_runtime.py --output out/imported-runtime
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-runtime-${{ github.run_id }}
          path: out/imported-runtime/binary/runtime-dist.zip
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/imported-runtime/capacity/
          retention-days: 90
          if-no-files-found: error
