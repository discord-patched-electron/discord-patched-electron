name: Candidate Electron build
on:
  workflow_dispatch:
    inputs:
      runtime_key:
        description: Optional immutable key reserved by the update coordinator
        type: string
        default: ""
      target:
        description: Locked Electron channel to compile and validate
        type: choice
        options: [prerelease]
        default: prerelease
      parallel_jobs:
        description: Ninja tasks (auto respects CPU/RAM limits; takes effect on this dispatch)
        type: choice
        options: [auto, "1", "2", "3", "4", "6", "8", "12", "16", "20", "24", "32"]
        default: auto
permissions:
  contents: read
concurrency:
  group: electron-compilation
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'discord-patched-electron/discord-patched-electron' && github.ref == 'refs/heads/main'
    environment: local-compiler
    runs-on: [self-hosted, linux, x64, discord-electron-compiler]
    timeout-minutes: 1320
    env:
      ELECTRON_BUILD_CACHE: /work/build-cache
      ELECTRON_COMPILER_CACHE_SIZE: "32G"
      ELECTRON_BUILD_JOBS: ${{ inputs.parallel_jobs || 'auto' }}
      SENTRYCLI_SKIP_DOWNLOAD: "1"
      PYTHONUNBUFFERED: "1"
      EXPECTED_RUNTIME_KEY: ${{ inputs.runtime_key || '' }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Build or reuse the locked runtime
        shell: bash
        run: |
          if [ -n "$EXPECTED_RUNTIME_KEY" ]; then
            PYTHONPATH=scripts python -c 'import os; from common import read_json; from build_reference import build_config; from runtime_fingerprints import runtime_key; s=read_json("config/sources.lock.json"); assert runtime_key(s["targets"]["prerelease"], s, build_config("prerelease")) == os.environ["EXPECTED_RUNTIME_KEY"], "Source changed since scheduling"'
          fi
          mkdir -p out/capacity
          set -o pipefail
          /usr/bin/time -v timeout --signal=INT --kill-after=60s 21h \
            python3 scripts/build_reference.py --target "$ELECTRON_BUILD_TARGET" 2>&1 | tee out/capacity/build.log
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/capacity/*.json
            out/capacity/*.log
          retention-days: 90
          if-no-files-found: warn
      - name: Retain binary for all three client compatibility tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-runtime-${{ github.run_id }}
          path: out/capacity/runtime-dist.zip
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
