name: Candidate Electron build
on:
  workflow_dispatch:
    inputs:
      runtime_key:
        description: Optional immutable key reserved by the update coordinator
        type: string
        default: ""
      target:
        description: Electron track enabled in config/channels.json
        type: string
        default: prerelease
      parallel_jobs:
        description: Ninja tasks (auto respects CPU/RAM limits; takes effect on this dispatch)
        type: choice
        options: [auto, "1", "2", "3", "4", "6", "8", "12", "16", "20", "24", "32"]
        default: auto
permissions:
  contents: read
concurrency:
  group: electron-compilation
  cancel-in-progress: false
jobs:
  allowance:
    if: github.repository == 'discord-patched-electron/discord-patched-electron' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      runner: ${{ steps.reserve.outputs.runner }}
      timeout: ${{ steps.reserve.outputs.timeout }}
      build_minutes: ${{ steps.reserve.outputs.build_minutes }}
      runtime_key: ${{ steps.reserve.outputs.runtime_key }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUNTIME_KEY: ${{ inputs.runtime_key }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/state_branch.py checkout out/state
      - id: reserve
        name: Reserve the maximum allowance before runner allocation
        run: python3 scripts/blacksmith_budget.py
  compile:
    needs: allowance
    if: github.run_attempt == 1
    runs-on: ${{ needs.allowance.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.allowance.outputs.timeout) }}
    env:
      ELECTRON_COMPILER_CACHE_SIZE: "3G"
      ELECTRON_BUILD_JOBS: ${{ inputs.parallel_jobs || 'auto' }}
      SENTRYCLI_SKIP_DOWNLOAD: "1"
      PYTHONUNBUFFERED: "1"
      EXPECTED_RUNTIME_KEY: ${{ needs.allowance.outputs.runtime_key }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
      BUILD_MINUTES: ${{ needs.allowance.outputs.build_minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Restore bounded compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/electron-sccache
          key: compiler-linux-x64-${{ hashFiles('config/compiler-cache.json', 'config/candidate-build.json', 'ci/gn/BUILD.gn.in') }}-${{ github.run_id }}
          restore-keys: |
            compiler-linux-x64-${{ hashFiles('config/compiler-cache.json', 'config/candidate-build.json', 'ci/gn/BUILD.gn.in') }}-
      - name: Build or reuse the locked runtime
        env:
          ELECTRON_BUILD_CACHE: ${{ runner.temp }}/electron-build
          ELECTRON_COMPILER_CACHE: ${{ runner.temp }}/electron-sccache
        shell: bash
        run: |
          if [ -n "$EXPECTED_RUNTIME_KEY" ]; then
            PYTHONPATH=scripts python -c 'import os; from common import read_json; from build_reference import build_config; from runtime_fingerprints import runtime_key; s=read_json("config/sources.lock.json"); target=os.environ["ELECTRON_BUILD_TARGET"]; assert runtime_key(s["targets"][target], s, build_config(target)) == os.environ["EXPECTED_RUNTIME_KEY"], "Source changed since scheduling"'
          fi
          mkdir -p out/capacity
          set -o pipefail
          /usr/bin/time -v timeout --signal=INT --kill-after=60s "${BUILD_MINUTES}m" \
            python3 scripts/build_reference.py --target "$ELECTRON_BUILD_TARGET" 2>&1 | tee out/capacity/build.log
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/capacity/*.json
            out/capacity/*.log
          retention-days: 90
          if-no-files-found: warn
      - name: Retain binary for client compatibility tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-runtime-${{ github.run_id }}
          path: out/capacity/runtime-dist.zip
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Save cache after successful or failed compilation
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/electron-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
