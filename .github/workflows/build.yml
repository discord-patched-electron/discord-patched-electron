name: Candidate Electron build
run-name: Electron ${{ inputs.runtime_key || inputs.target }}
on:
  workflow_dispatch:
    inputs:
      runtime_key:
        description: Optional immutable key reserved by the update coordinator
        type: string
        default: ""
      target:
        description: Electron track enabled in config/channels.json
        type: string
        default: prerelease
      compiler:
        description: Compiler for this dispatch only (routine builds use Blacksmith)
        type: choice
        options: [blacksmith, local]
        default: blacksmith
      parallel_jobs:
        description: Ninja tasks (auto respects CPU/RAM limits; takes effect on this dispatch)
        type: choice
        options: [auto, "1", "2", "3", "4", "6", "8", "12", "16", "20", "24", "32"]
        default: auto
permissions:
  contents: read
concurrency:
  group: electron-compilation
  cancel-in-progress: false
env:
  # Identical physical paths are required for reusable Clang modules.
  ELECTRON_BUILD_CACHE: /tmp/dpe-electron-build
  ELECTRON_INCREMENTAL_WORKSPACE: "1"
jobs:
  source:
    if: github.repository == 'discord-patched-electron/discord-patched-electron' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      local: ${{ steps.provider.outputs.local }}
    env:
      EXPECTED_RUNTIME_KEY: ${{ inputs.runtime_key }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
      COMPILER: ${{ inputs.compiler || 'blacksmith' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select compiler provider
        id: provider
        run: python3 -c 'import os; p=os.environ["COMPILER"]; assert p in ("local", "blacksmith"); open(os.environ["GITHUB_OUTPUT"], "a").write("local=" + str(p == "local").lower() + "\n")'
      - name: Assemble and check source before reserving Blacksmith minutes
        run: |
          if [ -n "$EXPECTED_RUNTIME_KEY" ]; then
            python3 scripts/check_runtime_key.py
          fi
          python3 scripts/build_reference.py --target "$ELECTRON_BUILD_TARGET" --source-only
          python3 scripts/build_checkpoint.py pack --target "$ELECTRON_BUILD_TARGET" --directory out/source-checkpoint
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prepared-source-${{ github.run_id }}
          path: out/source-checkpoint/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  allowance:
    needs: source
    concurrency:
      group: electron-state-writer
      cancel-in-progress: false
    if: needs.source.outputs.local != 'true' && github.repository == 'discord-patched-electron/discord-patched-electron' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      runner: ${{ steps.reserve.outputs.runner }}
      timeout: ${{ steps.reserve.outputs.timeout }}
      build_minutes: ${{ steps.reserve.outputs.build_minutes }}
      runtime_key: ${{ steps.reserve.outputs.runtime_key }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUNTIME_KEY: ${{ inputs.runtime_key }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/state_branch.py checkout out/state
      - uses: ./.github/actions/blacksmith-usage
        with:
          token: ${{ secrets.BLACKSMITH_API_TOKEN }}
      - id: reserve
        name: Reserve the maximum allowance before runner allocation
        run: python3 scripts/blacksmith_budget.py
  compile:
    needs: allowance
    if: github.run_attempt == 1
    runs-on: ${{ needs.allowance.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.allowance.outputs.timeout) }}
    env:
      ELECTRON_COMPILER_CACHE_SIZE: "3G"
      ELECTRON_BUILD_JOBS: ${{ inputs.parallel_jobs || 'auto' }}
      SENTRYCLI_SKIP_DOWNLOAD: "1"
      PYTHONUNBUFFERED: "1"
      EXPECTED_RUNTIME_KEY: ${{ needs.allowance.outputs.runtime_key }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
      BUILD_MINUTES: ${{ needs.allowance.outputs.build_minutes }}
    steps:
      - name: Start the reserved runner deadline
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Identify the compatible incremental workspace
        id: identity
        run: echo "workspace=$(python3 scripts/build_checkpoint.py identity --target "$ELECTRON_BUILD_TARGET")" >> "$GITHUB_OUTPUT"
      - name: Restore source and Ninja checkpoint
        id: checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/electron-checkpoint
          key: ninja-v2-${{ steps.identity.outputs.workspace }}-${{ needs.allowance.outputs.runtime_key }}-${{ github.run_id }}
          restore-keys: |
            ninja-v2-${{ steps.identity.outputs.workspace }}-${{ needs.allowance.outputs.runtime_key }}-
            ninja-v2-${{ steps.identity.outputs.workspace }}-
      - name: Download source prepared on the free runner
        if: steps.checkpoint.outputs.cache-matched-key == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared-source-${{ github.run_id }}
          path: ${{ runner.temp }}/electron-checkpoint
      - name: Verify and restore the checkpoint at its original path
        env:
          CHECKPOINT: ${{ runner.temp }}/electron-checkpoint
        run: python3 scripts/build_checkpoint.py restore --target "$ELECTRON_BUILD_TARGET" --directory "$CHECKPOINT"
      - name: Build or reuse the locked runtime
        id: build
        env:
          ELECTRON_COMPILER_CACHE: ${{ runner.temp }}/electron-sccache
        shell: bash
        run: |
          if [ -n "$EXPECTED_RUNTIME_KEY" ]; then
            python3 scripts/check_runtime_key.py
          fi
          mkdir -p out/capacity
          set -o pipefail
          elapsed=$(( $(date +%s) - ${{ steps.clock.outputs.started }} ))
          seconds=$(( BUILD_MINUTES * 60 - elapsed ))
          if [ "$seconds" -le 0 ]; then
            echo "Preparation used the available build time; retaining the checkpoint."
            exit 1
          fi
          /usr/bin/time -v timeout --signal=INT --kill-after=60s "${seconds}s" \
            python3 scripts/build_reference.py --target "$ELECTRON_BUILD_TARGET" 2>&1 | tee out/capacity/build.log
      - name: Retain binary for client compatibility tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-runtime-${{ github.run_id }}
          path: out/capacity/runtime-dist.zip
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Checkpoint completed work before the job deadline
        id: pack
        if: always() && steps.build.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 8
        env:
          CHECKPOINT: ${{ runner.temp }}/electron-checkpoint
        run: python3 scripts/build_checkpoint.py pack --target "$ELECTRON_BUILD_TARGET" --directory "$CHECKPOINT"
      - name: Authenticate cache maintenance
        id: cache-auth
        continue-on-error: true
        if: always() && steps.pack.outcome == 'success'
        uses: ./.github/actions/blacksmith-cli
        with:
          token: ${{ secrets.BLACKSMITH_API_TOKEN }}
      - name: Retain one managed checkpoint within the free cache capacity
        id: trim
        if: always() && steps.pack.outcome == 'success' && steps.cache-auth.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/blacksmith_checkpoint_retention.py
      - name: Save bounded checkpoint after successful or failed compilation
        continue-on-error: true
        if: always() && steps.pack.outcome == 'success' && steps.trim.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/electron-checkpoint
          key: ${{ steps.checkpoint.outputs.cache-primary-key }}
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/capacity/*.json
            out/capacity/*.log
          retention-days: 90
          if-no-files-found: warn
  local:
    needs: source
    if: needs.source.outputs.local == 'true' && github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, discord-electron-compiler]
    timeout-minutes: 4320
    env:
      ELECTRON_BUILD_CACHE: /work/build-cache
      ELECTRON_BUILD_JOBS: ${{ inputs.parallel_jobs || 'auto' }}
      ELECTRON_BUILD_TARGET: ${{ inputs.target }}
      EXPECTED_RUNTIME_KEY: ${{ inputs.runtime_key }}
      SENTRYCLI_SKIP_DOWNLOAD: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Build on the PC with retained dependencies and Ninja objects
        shell: bash
        run: |
          if [ -n "$EXPECTED_RUNTIME_KEY" ]; then python3 scripts/check_runtime_key.py; fi
          mkdir -p out/capacity
          set -o pipefail
          /usr/bin/time -v python3 scripts/build_reference.py --target "$ELECTRON_BUILD_TARGET" 2>&1 | tee out/capacity/build.log
      - name: Retain binary for client compatibility tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-runtime-${{ github.run_id }}
          path: out/capacity/runtime-dist.zip
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/capacity/*.json
            out/capacity/*.log
          retention-days: 90
