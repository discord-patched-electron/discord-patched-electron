name: Publish AUR package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact public Canary release tag to publish to the AUR
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: aur-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'discord-patched-electron/discord-patched-electron' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-aur
        with:
          tag: ${{ inputs.release_tag }}
          ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
