name: Release Linux packages
on:
  workflow_call:
    secrets:
      CACHE_TOKEN:
        required: false
      RELEASE_SIGNING_KEY:
        required: false
    inputs:
      discord_channel:
        type: string
        default: canary
      clients_state:
        type: string
        required: true
      reference_run:
        type: string
        required: true
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      discord_channel:
        description: Discord channel enabled in config/channels.json
        type: string
        default: canary
      clients_state:
        description: Immutable ci-state commit (empty uses the latest discovered client)
        type: string
        default: ""
      reference_run:
        description: Successful compiler run ID (empty uses the last approved runtime)
        type: string
        default: ""
      publish:
        description: Publish public test packages after all checks pass
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-release-${{ inputs.discord_channel }}-${{ inputs.clients_state }}-${{ inputs.reference_run || github.run_id }}
  cancel-in-progress: false
jobs:
  inputs:
    if: >-
      github.repository == 'discord-patched-electron/discord-patched-electron' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      runtime: ${{ steps.inputs.outputs.runtime }}
      electron: ${{ steps.inputs.outputs.electron }}
      state: ${{ steps.inputs.outputs.state }}
      version: ${{ steps.inputs.outputs.version }}
      epoch: ${{ steps.inputs.outputs.epoch }}
      key: ${{ steps.inputs.outputs.key }}
      tag: ${{ steps.inputs.outputs.tag }}
      needed: ${{ steps.inputs.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNTIME: ${{ inputs.reference_run || '' }}
      CHANNEL: ${{ inputs.discord_channel }}
      CLIENTS_STATE: ${{ inputs.clients_state || '' }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: inputs
        run: python3 scripts/releases.py prepare
  bundled:
    needs: inputs
    if: needs.inputs.outputs.needed == 'true'
    uses: ./.github/workflows/native-runtime.yml
    with:
      clients_state: ${{ needs.inputs.outputs.state }}
      discord_channels: ${{ inputs.discord_channel }}
  native:
    needs: inputs
    if: needs.inputs.outputs.needed == 'true'
    uses: ./.github/workflows/native-runtime.yml
    with:
      reference_run: ${{ needs.inputs.outputs.runtime }}
      clients_state: ${{ needs.inputs.outputs.state }}
      discord_channels: ${{ inputs.discord_channel }}
  audio:
    needs: inputs
    if: needs.inputs.outputs.needed == 'true'
    uses: ./.github/workflows/app-audio.yml
    with:
      reference_run: ${{ needs.inputs.outputs.runtime }}
      clients_state: ${{ needs.inputs.outputs.state }}
      discord_channels: ${{ inputs.discord_channel }}

  package:
    needs: inputs
    if: needs.inputs.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ inputs.discord_channel }}
      PACKAGE: discord-${{ inputs.discord_channel }}-${{ needs.inputs.outputs.electron }}-patched-electron-bin
      CLIENTS_STATE: ${{ needs.inputs.outputs.state }}
      RUNTIME: ${{ needs.inputs.outputs.runtime }}
      VERSION: ${{ needs.inputs.outputs.version }}
      RELEASE_KEY: ${{ needs.inputs.outputs.key }}
      SOURCE_DATE_EPOCH: ${{ needs.inputs.outputs.epoch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
      - name: Install packaging tools
        run: |
          uv sync --locked
          bun install --frozen-lockfile --ignore-scripts
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/nfpm.tar.gz"
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential brotli xvfb xauth libnss3 libgtk-3-0t64 libgbm1 libasound2t64 libpulse0 libatomic1 libxss1 libxtst6 rpm libarchive-tools
      - name: Check source and workflow quality
        run: bun run lint && bun run test
      - name: Assemble pinned inputs without compiling Electron
        run: |
          python scripts/fetch_client_snapshot.py "$CLIENTS_STATE" --output out/clients.lock.json
          python scripts/fetch_reference.py "$RUNTIME" --output out/runtime
          python scripts/build_local_app.py --portable --discord "$CHANNEL" --clients out/clients.lock.json --artifact out/runtime --cache out/downloads --output out/staged-app
          mv out/staged-app "out/relocated app"
          cat <<EOF_RULE | sudo tee /etc/apparmor.d/discord-release-fixture >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile discord-release-fixture "$GITHUB_WORKSPACE/out/**/runtime/electron" flags=(unconfined) {
            userns,
          }
          profile discord-release-client-fixture "$GITHUB_WORKSPACE/out/**/profile/app-*/electron" flags=(unconfined) {
            userns,
          }
          EOF_RULE
          sudo apparmor_parser -r /etc/apparmor.d/discord-release-fixture
      - name: Launch and relaunch the relocated app
        run: xvfb-run -a python scripts/check_desktop_launch.py "out/relocated app" --output out/launch --relaunch
      - uses: ./.github/actions/check-client-mods
        with:
          app: out/relocated app
          output: out/mod-launch
      - name: Create Arch, Debian, RPM and portable packages
        run: |
          python scripts/package_release.py "out/relocated app" --output out/packages --version "$VERSION" --epoch "$SOURCE_DATE_EPOCH"
          python scripts/check_release_packages.py out/packages
          python scripts/publish_aur.py --manifest out/packages/release.json --output out/aur-recipe
      - name: Install the Debian package and check its shared libraries
        run: |
          sudo apt-get install -y ./out/packages/*.deb
          root="/opt/$PACKAGE"
          if ldd "$root/runtime/electron" | grep -q 'not found'; then exit 1; fi
          xvfb-run -a python scripts/check_desktop_launch.py "$root" --output out/deb-launch --relaunch --read-only-app
      - name: Install the RPM on Fedora and check it as an ordinary user
        run: |
          docker run --rm \
            -v "$PWD/out/packages:/packages:ro" \
            -v "$PWD/scripts/check_installed_package.py:/check.py:ro" \
            -e PACKAGE \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash -ec 'dnf install -y --setopt=install_weak_deps=False /packages/*.rpm; python3 /check.py "/opt/$PACKAGE"' \
            > out/rpm-install.log 2>&1
      - name: Install the Arch package and check it as an ordinary user
        run: |
          docker run --rm \
            -v "$PWD/out/packages:/packages:ro" \
            -v "$PWD/scripts/check_installed_package.py:/check.py:ro" \
            -e PACKAGE \
            archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0 \
            bash -ec 'pacman -Syu --noconfirm; pacman -U --noconfirm /packages/*.pkg.tar.zst; python /check.py "/opt/$PACKAGE"' \
            > out/arch-install.log 2>&1
      - name: Build and install the AUR recipe from the verified portable archive
        run: |
          docker run --rm \
            -v "$PWD/out/aur-recipe:/recipe:ro" \
            -v "$PWD/out/packages:/packages:ro" \
            -v "$PWD/scripts/check_installed_package.py:/check.py:ro" \
            -e PACKAGE \
            archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0 \
            bash -ec '
              pacman -Syu --noconfirm --needed base-devel python
              useradd -m builder
              cp -a /recipe /build
              version=$(sed -n "s/^pkgver=//p" /build/PKGBUILD)
              cp /packages/*-linux-x86_64.tar.gz "/build/$PACKAGE-$version.tar.gz"
              chown -R builder:builder /build
              cd /build
              runuser -u builder -- makepkg --nodeps --noconfirm
              pacman -U --noconfirm ./*.pkg.tar.zst
              python /check.py "/opt/$PACKAGE"
            ' > out/aur-install.log 2>&1
      - name: Keep release packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-packages-${{ inputs.discord_channel }}
          compression-level: 0
          retention-days: 7
          path: |
            out/packages/*.tar.gz
            out/packages/*.deb
            out/packages/*.rpm
            out/packages/*.pkg.tar.zst
            out/packages/release.json
            out/packages/SHA256SUMS
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-checks-${{ inputs.discord_channel }}
          path: |
            out/launch/**/launch-report.json
            out/launch/**/console.log
            out/mod-launch/**/launch-report.json
            out/mod-launch/**/console.log
            out/mod-launch/mod-report.json
            out/mod-launch/*-self-update/report.json
            out/deb-launch/**/launch-report.json
            out/deb-launch/**/console.log
            out/rpm-install.log
            out/arch-install.log
            out/aur-install.log
            out/aur-recipe/PKGBUILD
            out/aur-recipe/.SRCINFO
            out/packages/package-checks.json
            out/relocated app/local-build.json
            out/clients.lock.json
          retention-days: 30
  publish:
    if: inputs.publish && needs.inputs.outputs.needed == 'true'
    needs: [inputs, bundled, native, audio, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-${{ needs.inputs.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-packages-${{ inputs.discord_channel }}
          path: packages
      - name: Publish complete test packages
        # Only the publishing job receives the signing key, after all tests pass.
        env:
          CACHE_TOKEN: ${{ secrets.CACHE_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python3 scripts/release_signing.py sign packages
          unset RELEASE_SIGNING_KEY
          python3 scripts/releases.py publish packages
