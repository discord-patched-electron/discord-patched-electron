name: Approve tested release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact app release tag you installed and tested
        type: string
        required: true
      tested:
        description: Approve this exact build as stable after reviewing its test results
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: electron-state-writer
  cancel-in-progress: false
jobs:
  approve:
    if: inputs.tested && github.repository == 'discord-patched-electron/discord-patched-electron' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - name: Verify and promote the tested files
        run: python3 scripts/releases.py approve "$RELEASE_TAG"
  aur:
    needs: approve
    runs-on: ubuntu-24.04
    concurrency:
      group: aur-publisher
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - uses: ./.github/actions/publish-aur
        with:
          tag: ${{ inputs.release_tag }}
          ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
