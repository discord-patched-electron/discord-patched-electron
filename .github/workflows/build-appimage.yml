name: Check AppImage packaging
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ci/appimage/**
      - packaging/linux/appimage-apprun.sh
      - scripts/stage_appimage_dependencies.sh
      - tests/fixtures/appimage-dependencies.py
      - scripts/appimage.py
      - scripts/check_appimage.py
      - scripts/package_release.py
      - config/appimage-tools.json
      - .github/workflows/build-appimage.yml
  push:
    branches: [main]
    paths:
      - ci/appimage/**
      - packaging/linux/appimage-apprun.sh
      - scripts/stage_appimage_dependencies.sh
      - tests/fixtures/appimage-dependencies.py
      - scripts/appimage.py
      - scripts/check_appimage.py
      - config/appimage-tools.json
      - .github/workflows/build-appimage.yml
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-pinned builder and runtime
        run: python3 scripts/appimage.py --install out/appimage-tools --dependencies
      - name: Build and launch an AppImage from this checkout without FUSE
        run: python3 scripts/check_appimage.py --container
