name: Check official client mod installers
description: Verify install, upgrade, launch and uninstall with Vencord and Equicord.
inputs:
  app:
    description: Disposable app directory
    required: true
  output:
    description: Fresh launch report directory
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APP: ${{ inputs.app }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        fixture=$(mktemp -d "$RUNNER_TEMP/client-mods.XXXXXX")
        export EQUICORD_USER_DATA_DIR="$fixture/equicord"
        export VENCORD_USER_DATA_DIR="$fixture/vencord"
        mkdir -p "$EQUICORD_USER_DATA_DIR" "$VENCORD_USER_DATA_DIR"
        cp "$APP/resources/app.asar" "$fixture/bootstrap.asar"
        sha256sum "$APP/resources/app.asar" >"$fixture/bootstrap.sha256"
        restore() {
          if [[ -e "$APP/resources/_app.asar" ]]; then
            "$installer" -uninstall -location "$APP"
          fi
        }
        for mod in vencord equicord; do
          if [[ "$mod" == vencord ]]; then
            url=https://github.com/Vencord/Installer/releases/download/v1.4.2/VencordInstallerCli-linux
            checksum=52642c8521a866ad241c10337144a4f513672c54b9c86a8169954785054c815d
          else
            url=https://github.com/Equicord/Equilotl/releases/download/v2.3.0/EquilotlCli-linux
            checksum=1ee134c7295bbbb2ef7058d157509508832e17a543ac1bf753ca63b16d4a8bbd
          fi
          installer="$fixture/$mod-installer"
          curl --fail --location --silent --show-error --retry 3 "$url" --output "$installer"
          echo "$checksum  $installer" | sha256sum --check
          chmod +x "$installer"
          trap restore EXIT
          "$installer" -install -location "$APP"
          # Simulate upgrading over an installed mod with an older bootstrap.
          printf '\nprevious bootstrap\n' >> "$APP/resources/_app.asar"
          cp "$fixture/bootstrap.asar" "$APP/resources/app.asar"
          (cd "$APP" && sha256sum resources/app.asar > SHA256SUMS)
          sh packaging/linux/refresh-mod-backup.sh "$APP"
          cmp "$APP/resources/_app.asar" "$fixture/bootstrap.asar"
          "$installer" -install -location "$APP"
          xvfb-run -a python scripts/check_desktop_launch.py "$APP" --output "$OUTPUT/$mod" --relaunch --equicord
          restore
          sha256sum --check "$fixture/bootstrap.sha256"
          test ! -e "$APP/resources/_app.asar"
          trap - EXIT
        done
        sha256sum "$EQUICORD_USER_DATA_DIR/equicord.asar" "$VENCORD_USER_DATA_DIR/dist/patcher.js" "$VENCORD_USER_DATA_DIR/dist/preload.js" "$VENCORD_USER_DATA_DIR/dist/renderer.js" >"$OUTPUT/mod-sha256.txt"
        rm -rf "$fixture"
