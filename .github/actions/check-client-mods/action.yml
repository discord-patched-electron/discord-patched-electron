name: Check official client mod installers
description: Verify install, upgrade, launch and uninstall with Vencord and Equicord.
inputs:
  app:
    description: Disposable app directory
    required: true
  output:
    description: Fresh launch report directory
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APP: ${{ inputs.app }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        fixture=$(mktemp -d "$RUNNER_TEMP/client-mods.XXXXXX")
        for mod in vencord equicord; do
          if [[ "$mod" == vencord ]]; then
            url=https://github.com/Vencord/Installer/releases/download/v1.4.2/VencordInstallerCli-linux
            checksum=52642c8521a866ad241c10337144a4f513672c54b9c86a8169954785054c815d
          else
            url=https://github.com/Equicord/Equilotl/releases/download/v2.3.0/EquilotlCli-linux
            checksum=1ee134c7295bbbb2ef7058d157509508832e17a543ac1bf753ca63b16d4a8bbd
          fi
          installer="$fixture/$mod-installer"
          curl --fail --location --silent --show-error --retry 3 "$url" --output "$installer"
          echo "$checksum  $installer" | sha256sum --check
          chmod +x "$installer"
        done
        xvfb-run -a uv run python scripts/check_client_mods.py "$APP" --output "$OUTPUT" \
          --vencord "$fixture/vencord-installer" --equicord "$fixture/equicord-installer"
        rm -rf "$fixture"
