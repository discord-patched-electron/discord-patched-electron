name: Check the official Equicord installer
description: Install, launch and uninstall Equicord on a disposable app; leave its bootstrap unchanged.
inputs:
  app:
    description: Disposable app directory
    required: true
  output:
    description: Fresh launch report directory
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APP: ${{ inputs.app }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        fixture=$(mktemp -d "$RUNNER_TEMP/equicord.XXXXXX")
        export EQUICORD_USER_DATA_DIR="$fixture/data"
        mkdir -p "$EQUICORD_USER_DATA_DIR"
        installer="$fixture/EquilotlCli-linux"
        curl --fail --location --silent --show-error --retry 3 \
          https://github.com/Equicord/Equilotl/releases/download/v2.3.0/EquilotlCli-linux \
          --output "$installer"
        echo "1ee134c7295bbbb2ef7058d157509508832e17a543ac1bf753ca63b16d4a8bbd  $installer" | sha256sum --check
        chmod +x "$installer"
        sha256sum "$APP/resources/app.asar" > "$fixture/bootstrap.sha256"
        restore() {
          if [[ -e "$APP/resources/_app.asar" ]]; then
            "$installer" -uninstall -location "$APP"
          fi
        }
        trap restore EXIT
        "$installer" -install -location "$APP"
        xvfb-run -a python scripts/check_desktop_launch.py "$APP" --output "$OUTPUT" --relaunch --equicord
        sha256sum "$EQUICORD_USER_DATA_DIR/equicord.asar" > "$OUTPUT/equicord-sha256.txt"
        restore
        sha256sum --check "$fixture/bootstrap.sha256"
        test ! -e "$APP/resources/_app.asar"
        trap - EXIT
        rm -rf "$fixture"
