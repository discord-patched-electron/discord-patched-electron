name: Read Blacksmith allowance
description: Authenticate the pinned CLI and read organization-wide provider usage
inputs:
  token:
    description: Blacksmith organization token
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/blacksmith-cli
      with:
        token: ${{ inputs.token }}
    - name: Read provider usage
      shell: bash
      run: python3 scripts/blacksmith_usage.py
