name: Set up project tools
description: Install the pinned Python and JavaScript tooling and locked dependencies.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: "3.12"
        activate-environment: true
        enable-cache: true
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
    - shell: bash
      run: uv sync --locked
    - uses: ./.github/actions/setup-bun-dependencies
