[project]
name = "discord-patched-electron"
version = "0.1.0"
description = "Discord's native desktop integration on newer Electron"
requires-python = ">=3.12"
dependencies = ["capstone==5.0.6", "pyelftools==0.32"]

[dependency-groups]
dev = [
  "numpy==2.5.4",
  "ruff==0.17.2",
  "shellcheck-py==0.11.0.1",
  "shfmt-py==4.2.0",
  "clang-format==23.1.3",
  "actionlint-py==1.7.12.25",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packaging/upstream", "patches", "out", ".work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Standalone test files add scripts/ to sys.path before importing it.
"tests/**/*.py" = ["E402"]
"scripts/fingerprints.py" = ["F401"] # Public runtime_key re-export.
