[package]
name = "dpe-encoder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The private, checksum-verified FFmpeg tree is supplied by the package builder.
# Pure ownership/policy tests do not need to download or configure FFmpeg.
ffmpeg = []

[dependencies]
dpe-core = { path = "../media-core" }
dpe-os = { path = "../os" }
libc = "=0.2.191"

[build-dependencies]
bindgen = "=0.73.2"

[lints]
workspace = true
