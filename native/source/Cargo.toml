[package]
name = "dpe-source"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"

[[bin]]
name = "dpe-kms-source"
path = "src/bin/kms.rs"

[[bin]]
name = "dpe-screen-preview"
path = "src/bin/preview.rs"

[[bin]]
name = "dpe-wayland-source"
path = "src/bin/wayland.rs"

[[bin]]
name = "dpe-vkcapture-source"
path = "src/bin/game.rs"

[dependencies]
dpe-wayland = { path = "../wayland" }
dpe-core = { path = "../media-core" }
dpe-game = { path = "../game" }
dpe-os = { path = "../os" }
dpe-kms = { path = "../kms" }
dpe-graphics = { path = "../graphics", features = ["kms-capture", "game"] }
dpe-pipewire = { path = "../pipewire", features = ["source"] }
libc = "=0.2.191"

[lints]
workspace = true
